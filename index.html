<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="記帳">
<title>記帳</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap">
<style>
:root{
  --ink:#111111;--muted:#6B6B6B;--line:#F0F0F0;--soft:#F5F5F5;--edge:#E6E6E6;--red:#B3261E;
  --sage:#8FAE93;--sage-ink:#4F7A56;--sage-soft:#DFE7DC;
  --serif:'Noto Serif TC',serif;--sans:'Noto Sans TC',system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#FFFFFF;color:var(--ink);font-family:var(--sans);overscroll-behavior-y:none}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
.wrap{max-width:480px;margin:0 auto;padding:calc(20px + var(--safe-t)) 20px calc(200px + var(--safe-b))}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hdr .sub{font-size:13px;color:var(--muted)}
.hdr h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:0}
.circle{width:44px;height:44px;border:1px solid var(--edge);border-radius:22px;background:#FFF;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.circle.sm{width:40px;height:40px}
.backbar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.backbar .t{flex:1;text-align:center;font-family:var(--serif);font-size:22px;font-weight:600;margin-right:52px}
.h2{font-family:var(--serif);font-size:18px;font-weight:600;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center}
.pillbtn{height:32px;padding:0 14px;border:1px solid var(--edge);border-radius:16px;background:#FFF;font-size:12px}
.blackbtn{border:none;background:var(--ink);color:#FFF;border-radius:24px;height:48px;font-size:15px;font-weight:700;width:100%}
.greybtn{border:none;background:#EEEEEE;color:var(--ink);border-radius:24px;height:48px;font-size:15px;width:100%}
.dangerbtn{border:none;background:transparent;color:var(--red);height:44px;width:100%;font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.main{flex:1;min-width:0}
.nm{font-family:var(--serif);font-size:15px;font-weight:500}
.ds{font-size:12px;color:var(--muted)}
.amt{font-family:var(--serif);font-weight:600;font-size:15px;white-space:nowrap}
.neg{color:var(--red)}.pos{color:var(--sage-ink)}
.badge{width:42px;height:42px;border-radius:21px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:16px;overflow:hidden}
.badge img{width:100%;height:100%;object-fit:cover}
.chip{font-size:11px;padding:1px 8px;border-radius:9px;white-space:nowrap}
.empty{border:1.5px dashed #D0D0D0;border-radius:20px;padding:18px;text-align:center;font-size:13px;color:var(--muted)}
.card-soft{background:var(--soft);border-radius:24px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile3{border-radius:18px;padding:12px;background:var(--soft)}
.tile3 .k{font-size:11px;color:var(--muted)}.tile3 .v{font-family:var(--serif);font-size:18px;font-weight:600}
.tile3.black{background:var(--ink);color:#FFF}.tile3.black .k{color:#CFCFCF}
.tile3.sage{background:var(--sage);color:#FFF}.tile3.sage .k{color:#F1F5F0}
.bar{height:6px;background:#E2E2E2;border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .6s}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);margin-bottom:12px}
label.f input,label.f select,label.f textarea{height:46px;border:1px solid var(--edge);border-radius:14px;padding:0 14px;font-size:16px;background:#FFF;color:var(--ink);outline:none}
label.f textarea{height:80px;padding:10px 14px}
.toggle{width:50px;height:30px;border:none;border-radius:15px;background:#CFCFCF;position:relative;flex-shrink:0;transition:background .25s}
.toggle::after{content:'';position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:11px;background:#FFF;transition:left .25s}
.toggle.on{background:var(--ink)}.toggle.on::after{left:24px}
.seg{display:grid;gap:4px;background:var(--soft);border-radius:14px;padding:4px}
.seg button{height:38px;border:none;border-radius:10px;background:transparent;font-size:14px;color:var(--muted)}
.seg button.on{background:#FFF;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:34px;height:34px;border-radius:17px;border:3px solid #FFF;box-shadow:0 0 0 1px var(--edge)}
.swatch.on{box-shadow:0 0 0 2px var(--ink)}
.daygrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.daygrid button{height:38px;border:none;border-radius:10px;background:var(--soft);font-size:14px}
.daygrid button.on{background:var(--ink);color:#FFF;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:34px;padding:0 14px;border-radius:17px;border:none;font-size:13px}
/* hero */
.hero{position:relative;margin-top:18px;background:var(--soft);border-radius:24px;padding:22px 20px 42px;text-align:center}
.hero .k{font-size:13px;color:var(--muted);letter-spacing:2px}
.hero .big{font-family:var(--serif);font-size:46px;font-weight:600;line-height:1.25;margin-top:4px}
.hero .today{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);background:#FFF;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.1);padding:8px 18px;white-space:nowrap}
.hero .today .k{font-size:11px;letter-spacing:0}
.hero .today .v{font-family:var(--serif);font-size:18px;font-weight:600}
.budget-line{display:flex;justify-content:space-between;width:84%;margin:6px auto 0;font-size:12px;color:var(--muted)}
.budget-line b{font-family:var(--serif);color:var(--ink)}
/* avatar */
.coach{display:flex;align-items:flex-end;gap:10px;margin-top:42px}
.av{width:62px;height:62px;flex-shrink:0;border-radius:31px;background:var(--soft);display:flex;align-items:center;justify-content:center;transform-origin:50% 100%}
.say{flex:1;background:var(--soft);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:13px;line-height:1.65;animation:popMsg .4s ease-out}
.av.happy{animation:happy 1.1s ease-in-out 2}.av.normal{animation:sway 2.4s ease-in-out infinite}
.av.worry{animation:worry .6s ease-in-out 3}.av.cry{animation:cry .9s ease-in-out infinite}
@keyframes happy{0%,100%{transform:translateY(0)}25%{transform:translateY(-8px) rotate(-4deg)}50%{transform:translateY(0)}75%{transform:translateY(-5px) rotate(4deg)}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
@keyframes worry{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
@keyframes cry{0%,100%{transform:translateY(0) scaleY(1)}20%{transform:translateY(2px) scaleY(.96)}40%{transform:translateY(0) scaleY(1.02)}60%{transform:translateY(2px) scaleY(.96)}}
@keyframes popMsg{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
/* tiles */
.sq{aspect-ratio:1/1;border:none;border-radius:26px;padding:18px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.sq .top{display:flex;justify-content:space-between;align-items:center;width:100%}
.sq .ic{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.sq .k{display:block;font-size:13px}.sq .v{display:block;font-family:var(--serif);font-size:28px;font-weight:600}.sq .d{display:block;font-size:12px}
/* nav */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + var(--safe-b));width:min(340px,calc(100vw - 40px));height:64px;background:var(--ink);border-radius:32px;box-shadow:0 12px 30px rgba(0,0,0,.28);z-index:30}
#nav .bub{position:absolute;top:6px;height:52px;border-radius:26px;background:#FFF;transition:left .4s cubic-bezier(.22,1,.36,1)}
#nav .btns{position:relative;display:grid;grid-template-columns:repeat(3,1fr);height:64px}
#nav button{border:none;background:transparent;color:#BDBDBD;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:color .3s}
#nav button.on{color:var(--ink)}
#mic{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));width:64px;height:64px;margin-left:-32px;border:none;border-radius:32px;background:var(--ink);color:#FFF;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.28);z-index:31}
#mic.live{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(17,17,17,.35),0 10px 24px rgba(0,0,0,.28)}50%{box-shadow:0 0 0 14px rgba(17,17,17,0),0 10px 24px rgba(0,0,0,.28)}}
/* balloon */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:28;display:none}
#balloon{position:fixed;left:50%;bottom:calc(178px + var(--safe-b));width:min(440px,calc(100vw - 36px));transform-origin:50% 100%;z-index:29;display:none}
#balloon .in{position:relative;background:#FFF;border:1.5px solid var(--ink);border-radius:30px;padding:18px;box-shadow:0 16px 36px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 260px);overflow:auto}
#balloon .tail{position:absolute;left:50%;bottom:-10px;width:18px;height:18px;margin-left:-9px;background:#FFF;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg)}
#balloon.show{display:block;animation:bIn .55s cubic-bezier(.22,1,.36,1) both}
#balloon.hide{display:block;animation:bOut .4s cubic-bezier(.55,0,.85,.35) both}
@keyframes bIn{0%{transform:translateX(-50%) translateY(70px) scale(.1);opacity:0}100%{transform:translateX(-50%) translateY(0) scale(1);opacity:1}}
@keyframes bOut{0%{transform:translateX(-50%) translateY(0) scale(1);opacity:1}100%{transform:translateX(-50%) translateY(80px) scale(.06);opacity:0}}
.wave{display:flex;align-items:center;gap:3px;height:24px}
.wave i{width:3px;background:var(--ink);border-radius:2px;animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes wv{0%,100%{height:6px}50%{height:22px}}
.wave.lv i{animation:none;height:4px;transition:height .08s linear}
.parsed{background:var(--soft);border-radius:20px;padding:14px}
.parsed .bigamt{font-family:var(--serif);font-size:34px;font-weight:600;text-align:center}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.mini label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
.mini input,.mini select{height:38px;border:1px solid var(--edge);border-radius:12px;padding:0 10px;font-size:15px;background:#FFF;color:var(--ink)}
/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + var(--safe-t));width:min(320px,calc(100vw - 60px));background:var(--ink);color:#FFF;border-radius:22px;min-height:44px;padding:6px 8px 6px 18px;display:none;align-items:center;justify-content:space-between;gap:8px;font-size:13px;z-index:40;box-shadow:0 8px 20px rgba(0,0,0,.2)}
#toast.show{display:flex;animation:popMsg .3s ease-out}
#toast button{height:32px;padding:0 14px;border:none;border-radius:16px;background:#FFF;color:var(--ink);font-size:13px;font-weight:700}
/* calendar */
.dow{display:grid;grid-template-columns:repeat(7,1fr);margin-top:14px;text-align:center;font-size:11px;color:var(--muted)}
.calwrap{overflow:hidden;touch-action:pan-y;margin-top:4px}
.calin{position:relative}
.calin.fromR{animation:fromR .42s cubic-bezier(.22,1,.36,1)}.calin.fromL{animation:fromL .42s cubic-bezier(.22,1,.36,1)}
@keyframes fromR{0%{transform:translateX(70%);opacity:0}100%{transform:none;opacity:1}}
@keyframes fromL{0%{transform:translateX(-70%);opacity:0}100%{transform:none;opacity:1}}
.blob{position:absolute;height:44px;border-radius:16px;background:var(--ink);transition:left .5s cubic-bezier(.5,1.5,.45,.85),top .5s cubic-bezier(.5,1.5,.45,.85);pointer-events:none}
.blob.goo{animation:goo .6s ease-out}
@keyframes goo{0%{transform:scale(1,1)}30%{transform:scale(1.28,.78)}55%{transform:scale(.88,1.14)}75%{transform:scale(1.06,.95)}100%{transform:scale(1,1)}}
.calgrid{position:relative;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:46px;row-gap:2px}
.calgrid button{border:none;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:color .3s}
.calgrid button .n{font-family:var(--serif);font-size:14px}
.calgrid button .a{font-size:9px;color:var(--muted);transition:color .3s}
.calgrid button.today .n{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.calgrid button.sel{color:#FFF}.calgrid button.sel .a{color:#D0D0D0}.calgrid button.sel .n{text-decoration:none;font-weight:700}
.swipe{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.swipe .del{position:absolute;right:8px;top:0;bottom:0;display:flex;align-items:center}
.swipe .del button{width:48px;height:48px;border:none;border-radius:24px;background:var(--red);color:#FFF;display:flex;align-items:center;justify-content:center}
.swipe .front{position:relative;display:flex;align-items:center;gap:12px;padding:12px 0;background:#FFF;transition:transform .3s cubic-bezier(.2,.8,.2,1);touch-action:pan-y;user-select:none}
/* stats */
.donut{position:relative;width:210px;height:210px;border-radius:105px;margin:22px auto 0}
.donut .hole{position:absolute;inset:38px;border-radius:50%;background:#FFF;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ymseg{display:flex;background:var(--soft);border-radius:18px;padding:3px;position:relative}
.ymseg span{position:absolute;top:3px;width:52px;height:32px;border-radius:16px;background:var(--ink);transition:left .4s cubic-bezier(.34,1.56,.64,1)}
.ymseg button{position:relative;width:52px;height:32px;border:none;background:transparent;font-size:13px;transition:color .3s}
.bars{display:flex;align-items:flex-end;justify-content:space-between;height:170px;margin-top:12px}
.bars .col{display:flex;flex-direction:column;align-items:center;gap:6px}
.bars .pair{display:flex;align-items:flex-end;gap:2px}
.bars .pair i{width:9px;border-radius:5px;display:block}
/* card face */
.cardface{position:relative;aspect-ratio:1.586/1;border-radius:18px;color:#FFF;padding:18px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.18);background-size:cover;background-position:center}
.cardface .nm{font-family:var(--serif);font-size:18px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.cardface .bt{display:flex;justify-content:space-between;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
/* login */
.login{max-width:380px;margin:0 auto;padding:calc(80px + var(--safe-t)) 24px 40px;text-align:center}
.notice{background:var(--sage-soft);color:#26352A;border-radius:16px;padding:10px 14px;font-size:12px;line-height:1.6;margin-top:14px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"><div class="login"><div class="serif" style="font-size:22px">讀取中…</div></div></div>
<div id="veil"></div>
<div id="balloon" role="dialog" aria-label="記一筆"><div class="in" id="bIn"></div><span class="tail"></span></div>
<button id="mic" class="hidden" aria-label="AI 記一筆"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button>
<nav id="nav" class="hidden" aria-label="主選單"><span class="bub"></span><div class="btns">
  <button data-tab="home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/></svg>總覽</button>
  <button data-tab="detail"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>明細</button>
  <button data-tab="stats"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7"/></svg>統計</button>
</div></nav>
<div id="toast" role="status"><span id="toastText"></span><button id="toastBtn" class="hidden">復原</button></div>
<input type="file" id="filePick" accept="image/*" capture="environment" class="hidden">

<script>
(function () {
'use strict';
const CFG = window.LEDGER_CONFIG;
const DEMO = !CFG.firebase || !CFG.firebase.apiKey;

/* ---------------- 小工具 ---------------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => iso(new Date());
const ymOf = s => s.slice(0, 7);
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); };
const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const addMon = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const monLabel = ym => { const [y, m] = ym.split('-').map(Number); return y + ' 年 ' + m + ' 月'; };
const fmt = n => Math.round(+n || 0).toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };

function salary(ym) {
  const closed = S.settings.closed && S.settings.closed[ym];
  if (closed) return Object.assign({ locked: true }, closed);
  if (DEMO) {
    const [y, m] = ym.split('-').map(Number); const now = new Date();
    if (y > now.getFullYear() || (y === now.getFullYear() && m > now.getMonth() + 1)) return { fama: 0, patty: 0, photo: 0 };
    const r = DEMO_SALARY[m - 1] || [0, 0]; return { fama: r[0], patty: r[1], photo: 0 };
  }
  if (!S.settings.salarySync || !S.studioOk) return { fama: 0, patty: 0, photo: 0, off: true };
  const stu = {}; S.studio.students.forEach(s => stu[s.id] = s);
  let fama = 0, patty = 0, photo = 0;
  for (const l of S.studio.lessons) {
    if (l.status !== 'attended' || !(l.date || '').startsWith(ym)) continue;
    const src = l.source || (stu[l.studentId] && stu[l.studentId].source) || 'self';
    if (src === 'fama') fama += +l.fee || 0; else patty += +l.fee || 0;
  }
  for (const i of S.studio.income) {
    if (!(i.date || '').startsWith(ym)) continue;
    if (i.type === 'photo') photo += +i.amount || 0; else patty += +i.amount || 0;
  }
  for (const s of S.studio.students) for (const sc of (s.scores || [])) if (sc.paid && (sc.date || '').startsWith(ym)) patty += +sc.price || 0;
  return { fama, patty, photo };
}
const salaryTotal = ym => { const s = salary(ym); return (s.fama || 0) + (s.patty || 0) + (s.photo || 0); };
const incomeOf = ym => salaryTotal(ym) + incomeEntriesOf(ym);

function moodOf(ym) {
  const b = budgetOf(ym); const used = b ? expenseOf(ym) / b : 0;
  return { used, mood: used < 0.6 ? 'happy' : used < 0.8 ? 'normal' : used < 0.9 ? 'worry' : 'cry' };
}

/* 信用卡帳單週期：closeDay 結帳、payDay 繳款 */
function statement(card, ym) {
  const cd = clamp(+card.closeDay || 0, 0, 31); if (!cd) return null;
  const prev = addMon(ym, -1);
  const prevClose = parseD(prev + '-' + pad(Math.min(cd, daysIn(prev))));
  const startD = iso(new Date(prevClose.getFullYear(), prevClose.getMonth(), prevClose.getDate() + 1));
  const closeDate = ym + '-' + pad(Math.min(cd, daysIn(ym)));
  const pdRaw = +card.payDay || 0;
  const payYm = pdRaw && pdRaw <= cd ? addMon(ym, 1) : ym;
  const dueDate = pdRaw ? payYm + '-' + pad(Math.min(pdRaw, daysIn(payYm))) : '';
  const swipes = S.entries.filter(e => e.type === 'expense' && e.cardId === card.id && e.date >= startD && e.date <= closeDate);
  const est = swipes.reduce((t, e) => t + (+e.amount || 0), 0);
  const bill = S.bills[ym + '_card_' + card.id] || {};
  return { key: ym + '_card_' + card.id, ym, from: startD, closeDate, dueDate, est, amount: bill.amount != null ? +bill.amount : est, fromBill: bill.amount != null, paid: !!bill.paid };
}
function dueItems() {
  const t = todayISO(), ym = ymOf(t), out = [];
  for (const c of S.settings.cards) {
    let st = statement(c, ym);
    if (st && st.closeDate > t) st = statement(c, addMon(ym, -1));
    if (st && !st.paid && st.amount > 0) out.push({ kind: 'card', card: c, st, date: st.dueDate || st.closeDate, amount: st.amount });
  }
  for (const f of S.settings.fixed.filter(f => f.active !== false)) {
    const date = ym + '-' + pad(Math.min(+f.day || 1, daysIn(ym)));
    const key = ym + '_fx_' + f.id; const paid = (f.auto && date <= t) || !!(S.bills[key] && S.bills[key].paid);
    out.push({ kind: 'fixed', f, key, date, amount: +f.amount || 0, paid });
  }
  return out;
}
function nextSubDate(s) {
  const t = todayISO(); let ym = ymOf(t); let d = ym + '-' + pad(Math.min(+s.day || 1, daysIn(ym)));
  if (d < t) { ym = addMon(ym, 1); d = ym + '-' + pad(Math.min(+s.day || 1, daysIn(ym))); }
  return d;
}
const daysUntil = d => Math.round((parseD(d) - parseD(todayISO())) / 864e5);

/* 固定支出、手動訂閱：到了日子自動記一筆（id 固定，不會重複） */
async function ensureRecurring() {
  const t = todayISO(), ym = ymOf(t), skip = new Set(S.settings.skipRecurring || []);
  const have = new Set(S.entries.map(e => e.id));
  for (const f of S.settings.fixed.filter(f => f.active !== false)) {
    const id = 'fx_' + ym + '_' + f.id; const date = ym + '-' + pad(Math.min(+f.day || 1, daysIn(ym)));
    if (date <= t && !have.has(id) && !skip.has(id)) await Store.putEntry({ id, date, type: 'expense', amount: +f.amount || 0, name: f.name, category: f.category || '固定支出', cardId: f.cardId || '', source: 'fixed', createdAt: Date.now() });
  }
  for (const s of S.settings.subs.filter(s => s.source !== 'gmail')) {
    const id = 'sb_' + ym + '_' + s.id; const date = ym + '-' + pad(Math.min(+s.day || 1, daysIn(ym)));
    if (date <= t && !have.has(id) && !skip.has(id)) await Store.putEntry({ id, date, type: 'expense', amount: +s.amount || 0, name: s.name, category: '訂閱', cardId: s.cardId || '', source: 'sub', createdAt: Date.now() });
  }
}

const KW = [
  ['餐飲', /吃|餐|飯|麵|咖啡|飲料|茶|早餐|午餐|晚餐|宵夜|便當|全家|7-?11|小七|萊爾富|拉麵|火鍋|甜點|麥當勞|肯德基|壽司|燒肉|水果/i],
  ['交通', /車|捷運|公車|計程|uber|加油|油錢|停車|高鐵|台鐵|機票|悠遊/i],
  ['生活用品', /全聯|家樂福|日用|衛生紙|洗|超市|ikea|屈臣氏|康是美|大創|寶雅|好市多|costco/i],

// 把口語中文數字轉成阿拉伯數字：兩百五→250、一千二→1200、三萬五→35000、兩百二十五→225
function zhToDigits(text) {
  const D = { 零: 0, 〇: 0, 一: 1, 壹: 1, 二: 2, 兩: 2, 两: 2, 貳: 2, 三: 3, 參: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
  const U = { 十: 10, 拾: 10, 百: 100, 佰: 100, 千: 1000, 仟: 1000 };
  const conv = str => {
    let total = 0, sec = 0, num = 0, lastUnit = 0, sawZero = false;
    for (const ch of str) {
      if (ch in D) { if (D[ch] === 0) sawZero = true; num = D[ch]; continue; }
      if (ch === '萬' || ch === '万') { sec += num; total += (sec || 1) * 10000; sec = 0; num = 0; lastUnit = 10000; sawZero = false; continue; }
      const u = U[ch]; if (u) { sec += (num || (u === 10 ? 1 : 0)) * u; num = 0; lastUnit = u; sawZero = false; }
    }
    // 口語省略尾巴的單位：兩百五 = 250、一千二 = 1200、三萬五 = 35000
    if (num && lastUnit >= 100 && !sawZero) num *= lastUnit / 10;
    return total + sec + num;
  };
  return text.replace(/[零〇一壹二兩两貳三參四五六七八九十拾百佰千仟萬万]+/g, m => {
    if (!/[一壹二兩两貳三參四五六七八九十拾百佰千仟]/.test(m)) return m;
    if (m.length === 1 && !/[十拾]/.test(m)) return m; // 單一個「一」「三」多半不是金額
    const v = conv(m); return v ? String(v) : m;
  });
}
function ruleParse(text) {
  text = zhToDigits(text);
  const nums = (text.replace(/,/g, '').match(/\d+(\.\d+)?/g) || []).map(Number);
  let amount = nums.length ? nums[nums.length - 1] : 0;
  const wan = text.match(/(\d+(\.\d+)?)\s*萬/); if (wan) amount = +wan[1] * 10000;
  let type = 'expense', category = '其他', savingCat = '', incomeSource = '';
  if (/薪水|薪資|收入|入帳|進帳|匯款給我/.test(text)) type = 'income';
  for (const s of S.settings.incomeSources) if (text.includes(s) && /薪|收|入/.test(text)) { type = 'income'; incomeSource = s; }
  if (/存|儲蓄|定存|買股|股票/.test(text)) { type = 'saving'; const sc = S.settings.savingsCats.find(c => text.includes(c.name)); savingCat = sc ? sc.name : (S.settings.savingsCats[0] || {}).name || ''; }
  if (type === 'expense') for (const [c, re] of KW) if (re.test(text) && S.settings.categories.some(x => x.name === c)) { category = c; break; }
  let date = todayISO(); if (/昨天/.test(text)) date = iso(new Date(Date.now() - 864e5)); if (/前天/.test(text)) date = iso(new Date(Date.now() - 2 * 864e5));
  const card = (S.settings.cards.find(c => text.toLowerCase().includes(c.name.toLowerCase().replace(/卡$/, ''))) || {}).name || '';
  const name = text.replace(/\d+(\.\d+)?\s*(元|塊|萬)?/g, '').replace(/昨天|前天|今天|花了|買了|用|刷|記|一下|的/g, '').trim().slice(0, 10) || (type === 'expense' ? category : type === 'income' ? '收入' : '存錢');
  return { type, amount, name, category, date, card, savingCat, incomeSource };
}

function entryRow(e) {

  else { const c = catOf(e.category); color = c.color; label = c.name; }

    '<div class="main"><div class="nm">' + esc(e.name) + '</div><div style="display:flex;align-items:center;gap:6px;margin-top:3px"><span class="chip" style="background:' + color + ';color:' + (e.type === 'income' ? '#FFF' : '#111') + '">' + esc(label) + '</span><span class="ds">' + esc(how) + '</span></div></div>' +
    '<span class="amt ' + cls + '">' + sign + fmt(e.amount) + '</span></div></div>';
}
function bindSwipe(el) {
  let sx = null, dx = 0, moved = false;
  const open = () => el.dataset.open === '1';
  el.addEventListener('pointerdown', e => { sx = e.clientX; dx = 0; moved = false; el.style.transition = 'none'; });
  el.addEventListener('pointermove', e => { if (sx == null) return; dx = e.clientX - sx; if (Math.abs(dx) > 6) moved = true; const base = open() ? -76 : 0; el.style.transform = 'translateX(' + clamp(base + dx, -110, 0) + 'px)'; });
  const end = () => {
    if (sx == null) return; sx = null; el.style.transition = '';
    if (moved) { const willOpen = open() ? dx < 30 : dx < -40; setOpen(el, willOpen); }
    else if (open()) setOpen(el, false);
    else openPage('entry', el.dataset.id);
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', () => { sx = null; el.style.transition = ''; setOpen(el, open()); });
}
function setOpen(el, on) {
  document.querySelectorAll('.front[data-open="1"]').forEach(x => { if (x !== el) { x.dataset.open = ''; x.style.transform = ''; } });
  el.dataset.open = on ? '1' : ''; el.style.transform = on ? 'translateX(-76px)' : '';
}

function statMonth(ym) {
  const cats = {}; S.entries.filter(e => e.type === 'expense' && inMon(e, ym)).forEach(e => cats[e.category || '其他'] = (cats[e.category || '其他'] || 0) + (+e.amount || 0));
  const list = Object.keys(cats).map(k => ({ name: k, amount: cats[k], color: catOf(k).color })).sort((a, b) => b.amount - a.amount);
  const total = list.reduce((t, x) => t + x.amount, 0); let acc = 0;
  const grad = total ? 'conic-gradient(' + list.map(x => { const a = acc / total * 100; acc += x.amount; return x.color + ' ' + a.toFixed(2) + '% ' + (acc / total * 100).toFixed(2) + '%'; }).join(',') + ')' : '#EEEEEE';
  const inc = incomeOf(ym), left = budgetOf(ym) - total;

function statYear(y) {

/* ---------- 表單儲存 ---------- */
document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'pf') return; ev.preventDefault();
  const fd = Object.fromEntries(new FormData(ev.target).entries()); const { p, id } = UI.page; const st = S.settings;
  const num = v => +String(v || '').replace(/[^\d.]/g, '') || 0;
  if (p === 'entry') {
    const old = S.entries.find(x => x.id === id) || {};
    const e = Object.assign({}, old, { id: id || rid('e'), type: fd.type, amount: num(fd.amount), name: fd.name || (fd.type === 'saving' ? '存錢' : fd.type === 'income' ? '收入' : fd.category), date: fd.date || todayISO(), note: fd.note || '', createdAt: old.createdAt || Date.now(), source: old.source || 'manual' });
    if (fd.type === 'expense') { e.category = fd.category; e.cardId = fd.cardId || ''; delete e.savingCat; }
    if (fd.type === 'saving') { e.savingCat = fd.savingCat; delete e.category; e.cardId = ''; }
    if (fd.type === 'income') { delete e.category; delete e.savingCat; e.cardId = ''; }
    if (!e.amount) return toast('先填金額');
    await Store.putEntry(e); closePage(); toast('已儲存');
  }
  if (p === 'card') {
    const d = UI.page.draft; d.name = fd.name || d.name; d.last4 = fd.last4 || '';
    if (!d.name) return toast('先填卡片名稱');
    const cards = st.cards.slice(); const i = cards.findIndex(x => x.id === id);
    const card = Object.assign({}, d, { id: id || rid('c'), closeDay: +d.closeDay || '', payDay: +d.payDay || '' });
    if (i >= 0) cards[i] = card; else cards.push(card);
    await Store.setSettings({ cards }); closePage(); toast('已儲存信用卡');
  }
  if (p === 'fixed') {
    const list = st.fixed.slice(); const i = list.findIndex(x => x.id === id);
    const f = { id: id || rid('f'), name: fd.name, amount: num(fd.amount), day: +fd.day || 1, auto: fd.auto === '1', active: fd.active !== '0', category: fd.category, cardId: fd.cardId || '' };
    if (i >= 0) list[i] = f; else list.push(f);
    await Store.setSettings({ fixed: list }); closePage(); toast('已儲存'); ensureRecurring();
  }
  if (p === 'sub') {
    const list = st.subs.slice(); const i = list.findIndex(x => x.id === id);
    const s = { id: id || rid('s'), name: fd.name, amount: num(fd.amount), day: +fd.day || 1, source: fd.source, cardId: fd.cardId || '' };
    if (i >= 0) list[i] = s; else list.push(s);
    await Store.setSettings({ subs: list }); closePage(); toast('已儲存'); ensureRecurring();
  }
  if (p === 'cat' || p === 'savecat') {
    const k = p === 'cat' ? 'categories' : 'savingsCats'; const list = st[k].slice(); const i = list.findIndex(x => x.id === id);
    const old = list[i] || {};
    if (list.some(x => x.name === fd.name && x.id !== id)) return toast('已經有這個分類了');
    const c = Object.assign({}, old, { id: id || rid('k'), name: fd.name, color: fd.color });
    if (p === 'savecat') { c.goal = num(fd.goal); c.initial = num(fd.initial); }

async function coachAfter(e) {

/* ---------- 帳單照片 ---------- */
function pickImage(cb) {
  const f = $('#filePick'); f.value = '';
  f.onchange = () => { if (f.files && f.files[0]) cb(f.files[0]); };
  f.click();
}
function fileToB64(file, maxSide, quality) {
  return new Promise((ok, no) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, maxSide / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok({ canvas: c, data: c.toDataURL('image/jpeg', quality || 0.85) });
    };
    img.onerror = no; img.src = url;
  });
}
async function cardFaceFromFile(file) {
  const { canvas } = await fileToB64(file, 1200);
  const W = 640, H = Math.round(640 / 1.586), out = document.createElement('canvas'); out.width = W; out.height = H;
  const g = out.getContext('2d'); const sr = W / H, ir = canvas.width / canvas.height;
  let sw = canvas.width, sh = canvas.height, sx = 0, sy = 0;
  if (ir > sr) { sw = sh * sr; sx = (canvas.width - sw) / 2; } else { sh = sw / sr; sy = (canvas.height - sh) / 2; }
  g.drawImage(canvas, sx, sy, sw, sh, 0, 0, W, H);
  // 卡號區（約中間偏下）自動模糊
  const band = document.createElement('canvas'); band.width = W; band.height = Math.round(H * 0.26);
  const bg = band.getContext('2d'); bg.filter = 'blur(14px)'; bg.drawImage(out, 0, Math.round(H * 0.5), W, band.height, 0, 0, W, band.height);
  g.drawImage(band, 0, Math.round(H * 0.5));
  return out.toDataURL('image/jpeg', 0.72);
}

function showBill() {
  const b = BAL.bill, st = S.settings;

  const ym = /^\d{4}-\d{2}/.test(b.closeDate) ? b.closeDate.slice(0, 7) : ymOf(todayISO());
  const stt = statement(Object.assign({}, card, { closeDay: /^\d{4}-\d{2}-\d{2}$/.test(b.closeDate) ? +b.closeDate.slice(8) : card.closeDay }), ym);
  const diff = stt ? b.amount - stt.est : 0; BAL.bill.ym = ym; BAL.bill.diff = diff;
  bSet(bTop('確認帳單') + '<div class="parsed"><div class="bigamt">' + fmt(b.amount) + '</div><div class="mini">' +
    '<label>信用卡<select id="blCard">' + st.cards.map(c => '<option value="' + c.id + '"' + (c.id === card.id ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') + '</select></label>' +
    '<label>應繳金額<input id="blAmt" inputmode="decimal" value="' + b.amount + '"></label>' +
    '<label>結帳日<input id="blClose" type="date" value="' + esc(b.closeDate) + '"></label><label>繳款截止<input id="blDue" type="date" value="' + esc(b.dueDate) + '"></label></div>' +
    (stt ? '<div class="muted" style="font-size:12px;margin-top:10px">這期 app 裡記到的刷卡共 ' + fmt(stt.est) + (Math.abs(diff) >= 1 ? '，' + (diff > 0 ? '帳單多了 ' + fmt(diff) + '（可能有漏記）' : '帳單少了 ' + fmt(-diff)) : '，跟帳單一樣') + '</div>' : '') + '</div>' +
    '<div class="grid2"><button class="greybtn" data-act="bClose">取消</button><button class="blackbtn" data-act="bBillSave">存帳單</button></div>' +
    (diff >= 1 ? '<button class="greybtn" data-act="bBillDiff">存帳單，並把差額 ' + fmt(diff) + ' 補記成支出</button>' : ''));

async function saveBill(withDiff) {
  const b = BAL.bill; b.cardId = $('#blCard').value; b.amount = +String($('#blAmt').value).replace(/[^\d.]/g, '') || 0; b.closeDate = $('#blClose').value; b.dueDate = $('#blDue').value;
  const card = S.settings.cards.find(c => c.id === b.cardId); const ym = b.closeDate ? b.closeDate.slice(0, 7) : b.ym;
  await Store.setBill(ym + '_card_' + b.cardId, { amount: b.amount, closeDate: b.closeDate, dueDate: b.dueDate, paid: false, at: Date.now() });
  if (card && card.perBill && b.closeDate) { const cards = S.settings.cards.map(c => c.id === card.id ? Object.assign({}, c, { closeDay: +b.closeDate.slice(8), payDay: b.dueDate ? +b.dueDate.slice(8) : c.payDay }) : c); await Store.setSettings({ cards }); }
  if (withDiff && b.diff >= 1) await Store.putEntry({ id: rid('e'), date: b.closeDate || todayISO(), type: 'expense', amount: Math.round(b.diff), name: (card ? card.name : '') + ' 帳單差額', category: '其他', cardId: b.cardId, source: 'bill', createdAt: Date.now() });
  closeBalloon(() => { toast('帳單已存'); go('due'); });
}
function saveBillDiff() { saveBill(true); }

/* ============================================================
   Gmail 同步（Apps Script 網頁應用程式）
   ============================================================ */
let syncing = false;
async function gmailSync(manual) {
  const g = S.settings.gmail; if (!g.url || syncing) { if (manual && !g.url) toast('先設定 Gmail 網址'); return; }
  syncing = true;
  try {
    const u = g.url + (g.url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(g.token || '') + '&since=' + (g.lastSync ? g.lastSync - 3 * 864e5 : 0);
    const r = await fetch(u); const j = await r.json();
    if (!j.ok) throw new Error(j.error || '同步失敗');
    const have = new Set(S.entries.map(e => e.gmailId).filter(Boolean));
    const dismissed = new Set(S.settings.dismissedMail || []);
    const pending = (S.settings.pendingSubs || []).slice(); let added = 0;
    for (const it of j.items || []) {
      if (!it.id || have.has(it.id) || dismissed.has(it.id)) continue;
      if (it.kind === 'card' && it.amount > 0) {
        const card = S.settings.cards.find(c => (it.last4 && c.last4 && c.last4 === String(it.last4)) || (it.cardHint && (it.cardHint.includes(c.name.replace(/卡$/, '')) || c.name.includes(it.cardHint))));
        await Store.putEntry({ id: 'gm_' + it.id, gmailId: it.id, date: it.date || todayISO(), type: 'expense', amount: +it.amount, name: it.merchant || '刷卡消費', category: S.settings.categories.some(c => c.name === it.category) ? it.category : '其他', cardId: card ? card.id : '', source: 'gmail', createdAt: Date.now() });
        added++;
      } else if (it.kind === 'subscription' && it.amount > 0) {
        const nm = (it.subscriptionName || it.merchant || '').trim(); const known = S.settings.subs.find(s => nm && (s.name.toLowerCase() === nm.toLowerCase()));
        await Store.putEntry({ id: 'gm_' + it.id, gmailId: it.id, date: it.date || todayISO(), type: 'expense', amount: +it.amount, name: nm || '訂閱', category: '訂閱', cardId: known ? known.cardId || '' : '', source: 'gmail', createdAt: Date.now() });
        added++;
        if (!known && nm && !pending.some(p => p.name.toLowerCase() === nm.toLowerCase())) pending.push({ id: rid('p'), name: nm, amount: +it.amount, day: it.date ? +it.date.slice(8) : 1, gmailId: it.id });
      }
    }
    await Store.setSettings({ gmail: Object.assign({}, S.settings.gmail, { lastSync: Date.now() }), pendingSubs: pending });
    if (manual || added) toast(added ? 'Gmail 新增了 ' + added + ' 筆' : 'Gmail 沒有新的紀錄');
  } catch (e) { if (manual) toast('Gmail 同步失敗：' + e.message); console.warn(e); }
  syncing = false;
}

/* ============================================================
   CSV
   ============================================================ */
function exportCsv() {
  const rows = [['日期', '類型', '金額', '分類', '名稱', '信用卡', '來源', '備註']];
  const T = { expense: '支出', income: '收入', saving: '儲蓄' };
  for (const e of S.entries.slice().sort((a, b) => a.date.localeCompare(b.date))) {
    const card = S.settings.cards.find(c => c.id === e.cardId); const sc = S.settings.savingsCats.find(c => c.id === e.savingCat);
    rows.push([e.date, T[e.type], e.amount, e.type === 'saving' ? (sc ? sc.name : '') : (e.category || ''), e.name, card ? card.name : '', e.source || '', e.note || '']);
  }
  const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = '記帳_' + todayISO() + '.csv'; a.click();
}
async function importCsv(text) {
  const lines = text.trim().split(/\r?\n/).filter(Boolean); if (!lines.length) return 0;
  const split = l => { const out = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === ',' && !q) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out.map(s => s.trim()); };
  let start = /日期|date/i.test(lines[0]) ? 1 : 0, n = 0;
  for (const l of lines.slice(start)) {
    const [date, typ, amt, cat, name] = split(l); const amount = +String(amt || '').replace(/[^\d.]/g, '');
    if (!/^\d{4}-\d{1,2}-\d{1,2}$/.test(date || '') || !amount) continue;
    const [y, m, d] = date.split('-'); const ds = y + '-' + pad(+m) + '-' + pad(+d);
    const type = /收/.test(typ) ? 'income' : /存|儲/.test(typ) ? 'saving' : 'expense';
    const e = { id: rid('e'), date: ds, type, amount, name: name || cat || '匯入', source: 'import', createdAt: Date.now() };
    if (type === 'expense') { if (cat && !S.settings.categories.some(c => c.name === cat)) await Store.setSettings({ categories: S.settings.categories.concat({ id: rid('k'), name: cat, color: PALETTE[S.settings.categories.length % PALETTE.length] }) }); e.category = cat || '其他'; }
    if (type === 'saving') { let sc = S.settings.savingsCats.find(c => c.name === cat); if (!sc && cat) { sc = { id: rid('k'), name: cat, color: PALETTE[S.settings.savingsCats.length % PALETTE.length], goal: 0, initial: 0 }; await Store.setSettings({ savingsCats: S.settings.savingsCats.concat(sc) }); } e.savingCat = sc ? sc.id : ''; }
    await Store.putEntry(e); n++;
  }
  return n;
}

/* ============================================================
   Toast / 登入 / 啟動
   ============================================================ */
let toastT;
function toast(msg, undo) {
  const t = $('#toast'); $('#toastText').textContent = msg; const btn = $('#toastBtn');
  btn.classList.toggle('hidden', !undo); btn.onclick = undo ? async () => { clearTimeout(toastT); t.classList.remove('show'); await undo(); } : null;
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), undo ? 4500 : 2600);
}
